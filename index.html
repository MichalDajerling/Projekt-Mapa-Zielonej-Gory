<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Zielonej Góry</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="map-container">
    <div id="sidebar" class="sidebar">
      <button id="sidebar-close" class="sidebar-close">&times;</button>
      <div id="sidebar-content">
        <h2 class="sidebar-title">Wybierz obszar</h2>
        <p class="sidebar-desc">Kliknij w obręb na mapie i wybierz przycisk „Wybierz”, aby zobaczyć szczegóły.</p>
      </div>
    </div>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/dane.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
